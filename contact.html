<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>Contact — Tal Feldman</title>
    <meta name="title" content="Contact — Tal Feldman">
    <meta name="description" content="Get in touch with Tal Feldman. Yale Law School JD candidate focused on AI, law, and national security.">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Tal Feldman">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://talxfeldman.com/contact.html">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://talxfeldman.com/contact.html">
    <meta property="og:title" content="Contact — Tal Feldman">
    <meta property="og:description" content="Get in touch with Tal Feldman.">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:url" content="https://talxfeldman.com/contact.html">
    <meta property="twitter:title" content="Contact — Tal Feldman">
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #1a1a1a;
            --secondary-dark: #2d2d2d;
            --text-primary: #0a0a0a;
            --text-secondary: #4a4a4a;
            --accent: #8b4513;
            --accent-light: #b8651f;
            --border-subtle: #e5e5e5;
            --bg-subtle: #fafafa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Work Sans', -apple-system, sans-serif;
            line-height: 1.7;
            color: var(--text-primary);
            background: #ffffff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Header */
        header {
            padding: 5rem 0 3rem;
            border-bottom: 1px solid var(--border-subtle);
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            color: var(--primary-dark);
            line-height: 1.1;
        }

        .back-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--accent);
        }

        /* Contact Section */
        .contact-section {
            padding: 5rem 0 8rem;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.3s forwards;
        }

        .contact-intro {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 3rem;
            max-width: 600px;
        }

        .contact-methods {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 500px;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .contact-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent);
            font-weight: 600;
        }

        .contact-value {
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .contact-value a {
            color: var(--text-primary);
            text-decoration: none;
            border-bottom: 1px solid var(--border-subtle);
            transition: all 0.3s ease;
        }

        .contact-value a:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* Footer */
        footer {
            padding: 3rem 0;
            border-top: 1px solid var(--border-subtle);
            background: var(--bg-subtle);
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .footer-links {
            display: flex;
            gap: 1.5rem;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        .footer-text {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        /* Skip Navigation */
        .skip-nav {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            padding: 0.75rem 1rem;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.5s forwards;
        }

        .skip-nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            margin: 0 0.75rem;
            transition: color 0.3s ease;
            font-weight: 400;
        }

        .skip-nav a:hover {
            color: var(--accent);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            header {
                padding: 3rem 0 2rem;
            }

            .contact-section {
                padding: 3rem 0 5rem;
            }

            .container {
                padding: 0 1.5rem;
            }

            .footer-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .skip-nav {
                top: 1rem;
                right: 1rem;
                padding: 0.5rem 0.75rem;
            }

            .skip-nav a {
                font-size: 0.8rem;
                margin: 0 0.5rem;
            }
        }
    </style>
</head>
<body>
    <nav class="skip-nav">
        <a href="index.html">Home</a>
        <a href="publications.html">Publications</a>
    </nav>
    
    <header>
        <div class="container">
            <a href="index.html" class="back-link">← Back to Home</a>
            <h1>Contact</h1>
        </div>
    </header>

    <section class="contact-section">
        <div class="container">
            <p class="contact-intro">
                Feel free to reach out about research collaborations, speaking engagements, or inquiries related to AI policy and national security.
            </p>
            
            <div class="contact-methods">
                <div class="contact-item">
                    <div class="contact-label">Email</div>
                    <div class="contact-value">
                        talxfeldman (at) gmail (dot) com
                    </div>
                </div>
                
                <div class="contact-item">
                    <div class="contact-label">LinkedIn</div>
                    <div class="contact-value">
                        <a href="https://www.linkedin.com/in/talfeldman/" target="_blank" rel="noopener">linkedin.com/in/talfeldman</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-text">
                    © 2026 Tal Feldman
                </div>
                <div class="footer-links">
                    <a href="index.html">Home</a>
                    <a href="publications.html">Publications</a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
